<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>WSET L2 Wine Regions Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5efe4; --ink:#2b2420; --muted:#7a6d62; --line:#dccfbb;
    --sea:#e9eef0; --land:#e6dccb; --land-wine:#d8c6a8; --border:#bfae94;
    --red:#8b2335; --white:#d9a92c; --both:#5c4a8a; --sweet:#c4651a;
    --sparkling:#3f8fb8; --fortified:#5a3420; --rose:#e07a93; --tasted:#1f7a4d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{padding:12px 14px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:20px;margin:0;line-height:1.1}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .toggles{display:flex;gap:6px;flex-shrink:0}
  .tog{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font:500 12px Inter,sans-serif;color:var(--ink);cursor:pointer;white-space:nowrap}
  .tog.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .row{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 6px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;border:1px solid var(--line);background:#fffaf2;border-radius:999px;padding:5px 10px;font:500 12px Inter,sans-serif;color:var(--ink);cursor:pointer}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff}
  .row.jump .chip{background:#fff}
  .row.jump .chip.on{background:var(--ink);border-color:var(--ink)}
  .rowlabel{flex-shrink:0;font-size:11px;color:var(--muted);align-self:center;text-transform:uppercase;letter-spacing:.06em}
  #mapwrap{position:relative;flex:1;min-height:0;background:var(--sea);border-top:1px solid var(--line);border-bottom:1px solid var(--line);touch-action:none}
  svg{display:block;width:100%;height:100%}
  .country{fill:var(--land);stroke:var(--border);vector-effect:non-scaling-stroke;stroke-width:.5}
  .country.wine{fill:var(--land-wine)}
  .pin{cursor:pointer}
  .pin .dot{stroke:#fff}
  .pin .ring{fill:none;stroke:var(--tasted)}
  .pin.dim{opacity:.12;pointer-events:none}
  .pin.sel .dot{stroke:var(--ink)}
  .lbl{font-weight:600;font-family:Inter,sans-serif;fill:var(--ink);paint-order:stroke;stroke:rgba(245,239,228,.9);pointer-events:none}
  .lbl.dim{display:none}
  .zoombtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
  .zoombtns button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font:600 18px Inter,sans-serif;color:var(--ink);cursor:pointer}
  .hint{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.8);padding:4px 8px;border-radius:8px}
  #legendBtn{position:absolute;left:10px;top:10px}
  #legend{position:absolute;left:10px;top:48px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.08)}
  #legend.open{display:block}
  #legend{max-width:250px;max-height:calc(100% - 60px);overflow-y:auto}
  #legend>div:not(.layers){display:flex;align-items:center;gap:8px;margin:3px 0}
  .sw{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .heatpill{display:inline-block;color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600}
  .heatrow{display:flex;align-items:center;gap:8px;margin:3px 0}
  .heatnote{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.35}
  .count{flex-wrap:wrap}
  .count .sp{flex:1}
  .qb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:600 12px Inter,sans-serif;color:var(--ink);cursor:pointer}
  .qb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tq{font-size:15px;line-height:1.45;margin:10px 0 4px;white-space:pre-line;font-weight:500}
  .topt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fffdf9;font:500 14px/1.35 Inter,sans-serif;color:var(--ink);cursor:pointer}
  .topt:disabled{cursor:default;opacity:1}
  .topt.right{background:#e7f4ec;border-color:#7cc29a}
  .topt.wrongpick{background:#fbe9e7;border-color:#e39a8f}
  .tres{margin-top:12px;font-size:14px;line-height:1.45}
  .tres .verdict{font-weight:700;margin-bottom:4px}
  .tres .verdict.ok{color:var(--tasted)} .tres .verdict.no{color:#b23b2b}
  .tres ul{margin:6px 0 0;padding-left:18px} .tres li{margin:5px 0;color:var(--muted)} .tres li.mine{color:var(--ink)}
  .tres h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 0 0;font-weight:600}
  .tbar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;position:relative;overflow:hidden}
  .tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:6px}
  .tline{font-size:12px;color:var(--muted);margin-top:4px}
  .reveal.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .swring{width:13px;height:13px;border-radius:50%;border:2px solid var(--tasted)}
  #card{position:fixed;left:0;right:0;bottom:0;max-height:62dvh;overflow-y:auto;background:#fff;border-radius:18px 18px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.15);padding:16px 18px 22px;transform:translateY(105%);transition:transform .25s ease;z-index:10}
  #card.open{transform:translateY(0)}
  #card .grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:-6px auto 10px}
  #card .close{position:absolute;right:12px;top:10px;border:none;background:var(--paper);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink)}
  #card h2{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:22px;margin:0 36px 2px 0}
  .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stylepill{font-size:11px;font-weight:600;color:#fff;border-radius:999px;padding:2px 8px}
  .sec{margin-top:12px}
  .sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 5px;font-weight:600}
  .sec p{margin:0;font-size:14px;line-height:1.45}
  .gchips{display:flex;flex-wrap:wrap;gap:6px}
  .tasted li{font-size:14px;margin:3px 0;line-height:1.35}
  .tasted ul{margin:0;padding-left:18px}
  .tasted{background:#eef6f1;border-radius:12px;padding:10px 12px}
  .tasted h3{color:var(--tasted)}
  .reveal{margin-top:12px;width:100%;padding:11px;border-radius:12px;border:none;background:var(--ink);color:#fff;font:600 14px Inter,sans-serif;cursor:pointer}
  .quizq{font-size:14px;color:var(--muted);margin-top:4px}
  .count{font-size:12px;color:var(--muted);padding:0 14px 8px;display:flex;align-items:center;gap:8px;min-height:30px}
  .count .gp{border:none;background:var(--red);color:#fff;border-radius:999px;padding:4px 10px;font:600 12px Inter,sans-serif;cursor:pointer}
  details.acc{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#fffdf9}
  details.acc>summary{list-style:none;cursor:pointer;padding:11px 12px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary::after{content:"＋";color:var(--muted);font-weight:500}
  details.acc[open]>summary::after{content:"－"}
  details.acc .in{padding:0 12px 12px}
  details.acc.tasted{background:#f1f8f4;border-color:#cfe6d9}
  details.acc.tasted>summary{color:var(--tasted)}
  .wine{border-top:1px solid #d9eadf;padding:10px 0 2px}
  .wine:first-child{border-top:none;padding-top:0}
  .wine .wn{font-weight:600;font-size:14px;margin-bottom:4px}
  .sat{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;line-height:1.4}
  .sat b{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
  .wc{font-size:13px;line-height:1.45;margin-top:6px;color:#3d342e;font-style:italic}
  .acc ul{margin:0;padding-left:18px}
  .acc li{font-size:14px;line-height:1.45;margin:4px 0}
  .food p{font-size:14px;line-height:1.45;margin:4px 0}
  .tagg{font-weight:600}
  .gprof{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;line-height:1.45;margin-top:12px}
  .gprof b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
  .rlist{display:flex;flex-wrap:wrap;gap:6px}
  .borders path{fill:none;stroke:var(--border);vector-effect:non-scaling-stroke;stroke-width:.5}
  .relief{pointer-events:none}
  .ctr{fill:none;stroke:#7a4f28;vector-effect:non-scaling-stroke;stroke-width:.55;opacity:.5;pointer-events:none}
  .ctr.m1000,.ctr.m2000{stroke-width:.85;opacity:.6}
  .clbl{font-family:Inter,sans-serif;font-weight:600;fill:#6a4524;paint-order:stroke;stroke:rgba(250,244,230,.9);pointer-events:none}
  .hramp{height:10px;border-radius:3px;margin:6px 0 2px;background:linear-gradient(90deg,#d6e0c4 0%,#e8e5c2 12.5%,#ecd9a8 25%,#e2c48c 40%,#dab77f 50%,#c69b69 62.5%,#b38760 75%,#a07a60 83%,#aca098 97%,#b9afa8 100%)}
  .hticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
  .belt{fill:#c9962a;opacity:.08;pointer-events:none}
  .lat{fill:none;stroke:#8aa0ab;vector-effect:non-scaling-stroke;stroke-width:.6;stroke-dasharray:2 3;pointer-events:none}
  .lat.major{stroke:#5f7783;stroke-width:.8;stroke-dasharray:none}
  .lat.edge{stroke:#a8791c;stroke-width:1.1;stroke-dasharray:6 3}
  .axis text{font:600 10px Inter,sans-serif;fill:#4d6470;paint-order:stroke;stroke:rgba(240,243,244,.92);stroke-width:3px;pointer-events:none}
  .axis text.edge{fill:#8a6214}
  .river{fill:none;stroke:#4f88ad;vector-effect:non-scaling-stroke;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.9;pointer-events:none}
  .rlbl{font-family:Inter,sans-serif;font-style:italic;font-weight:500;fill:#2f6489;paint-order:stroke;stroke:rgba(255,255,255,.85);pointer-events:none}
  .mtn{cursor:pointer}
  .mtn text{font-family:Inter,sans-serif;font-weight:600;fill:#6a4524;paint-order:stroke;stroke:rgba(255,250,240,.9)}
  .mtn .tri{fill:#8a5a2e;stroke:#fff}
  .layers{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
  .layers label{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;min-height:26px}
  .layers input{width:18px;height:18px;accent-color:var(--ink);margin:0}
  .ltitle{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .rule{font-size:11.5px;color:var(--muted);line-height:1.4;max-width:220px;margin-top:6px}
  .latrow{display:flex;align-items:center;gap:12px}
  .latval{font-weight:600;font-size:16px;white-space:nowrap;min-width:64px}
  .latbar{position:relative;flex:1;height:22px}
  .latbar .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:#ece5d8}
  .latbar .beltz{position:absolute;top:9px;height:4px;background:#e2c27a;border-radius:4px}
  .latbar .dotl{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ink);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
  .latbar .tk{position:absolute;top:16px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
  .latnote{font-size:13px;color:#3d342e;margin-top:6px;line-height:1.4}
  .srcnote{font-size:11.5px;color:var(--muted);margin-top:4px}
  .gnote{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
  .xt{width:100%;border-collapse:collapse;font-size:13px;line-height:1.35;margin-top:4px}
  .xt th,.xt td{text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .xt th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .xt td.n{text-align:right;font-weight:600;white-space:nowrap}
  .lobar{height:6px;border-radius:3px;background:var(--red);margin-top:4px}
  .xnote{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
  @media(max-width:400px){.sub{display:none}}
  .back{border:none;background:none;color:var(--muted);font:500 13px Inter,sans-serif;padding:0;margin-bottom:6px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div>
    <h1>Wine regions</h1>
    <div class="sub">WSET L2 · from your course notes</div>
  </div>
  <div class="toggles">
    <button class="tog" id="tHeat" aria-pressed="false">🌡 Heat</button>
    <button class="tog" id="tTasted" aria-pressed="false">✓ Tasted</button>
    <button class="tog" id="tQuiz" aria-pressed="false">Quiz me</button>
    <button class="tog" id="tExam">Exam</button>
  </div>
</header>

<div class="row jump" id="jumps"><span class="rowlabel">Go to</span></div>

<div id="mapwrap">
  <svg id="map"></svg>
  <button class="tog" id="legendBtn">Key</button>
  <div id="legend"></div>
  <div class="zoombtns">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
  </div>
  <div class="hint" id="hint">Pinch or use the buttons to zoom</div>
</div>

<div class="row" id="grapes"><span class="rowlabel">Grape</span></div>
<div class="count" id="count"></div>

<div id="card" role="dialog" aria-modal="false">
  <div class="grab"></div>
  <button class="close" id="cardClose" aria-label="Close">✕</button>
  <div id="cardBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="regions.js"></script>
<script src="extras.js"></script>
<script src="terrain.js"></script>
<script src="quiz.js"></script>
<script>
(function(){
  const R = window.REGIONS;
  const WINES = window.WINES||{}, TRAPS = window.TRAPS||{}, FOOD = window.FOOD||{}, GRAPES = window.GRAPES||{}, ALIAS = window.GRAPE_ALIAS||{};
  R.forEach(r=>{
    r.grapes = [...new Set(r.grapes.map(g=>ALIAS[g]||g))];
    r.wines = WINES[r.id]||[];
    r.tasted = r.wines.map(w=>w.n);
  });
  const STYLE = {
    red:{label:"Mostly red", c:"var(--red)"},
    white:{label:"Mostly white", c:"var(--white)"},
    both:{label:"Red & white", c:"var(--both)"},
    rose:{label:"Rosé", c:"var(--rose)"},
    sweet:{label:"Sweet", c:"var(--sweet)"},
    sparkling:{label:"Sparkling", c:"var(--sparkling)"},
    fortified:{label:"Fortified", c:"var(--fortified)"}
  };
  // Heat scale: from each region's climate call in your notes (not latitude)
  const HEAT = [
    {v:1,   label:"Cool",          c:"#2b6cb0"},
    {v:1.5, label:"Cool–moderate", c:"#3fa0bf"},
    {v:2,   label:"Moderate",      c:"#d9b12c"},
    {v:2.5, label:"Moderate–warm", c:"#ec8f2f"},
    {v:3,   label:"Warm",          c:"#dc5b28"},
    {v:3.5, label:"Warm–hot",      c:"#c0392b"},
    {v:4,   label:"Hot",           c:"#7f1d1d"}
  ];
  function heatOf(r){
    const s = String(r.climate||"").toLowerCase();
    let v;
    if(s.startsWith("cool coast")) v = 2;           // mixed region: averaged
    else if(s.startsWith("cool–moderate")) v = 1.5;
    else if(s.startsWith("moderate–warm")) v = 2.5;
    else if(s.startsWith("warm–hot")) v = 3.5;
    else if(s.startsWith("cool")) v = 1;
    else if(s.startsWith("moderate")) v = 2;
    else if(s.startsWith("warm")) v = 3;
    else if(s.startsWith("hot")) v = 4;
    return HEAT.find(h=>h.v===v) || null;
  }
  R.forEach(r=>{ r.heat = heatOf(r); });
  const WINE_COUNTRIES = new Set(["France","Germany","Italy","Spain","Portugal","Hungary","United States of America","Chile","Argentina","South Africa","Australia","New Zealand"]);

  const state = { weak:false, heat:false, grape:null, tasted:false, quiz:false, sel:null, revealed:false, k:1, t:d3.zoomIdentity };
  const LAYERS = {terrain:true, contours:true, rivers:true, mountains:true, lat:true};
  try{ Object.assign(LAYERS, JSON.parse(localStorage.getItem("wsetLayers")||"{}")); }catch(e){}

  // Region tests: results kept in this browser only
  const QUIZ = window.QUIZ||{};
  let TESTS = {};
  try{ TESTS = JSON.parse(localStorage.getItem("wsetTests")||"{}")||{}; }catch(e){ TESTS = {}; }
  function saveTests(){ try{ localStorage.setItem("wsetTests", JSON.stringify(TESTS)); }catch(e){} }
  function rec(id){ return TESTS[id] || (TESTS[id] = {missed:[]}); }
  function isWeak(id){ return !!(TESTS[id] && TESTS[id].missed && TESTS[id].missed.length); }

  // Legend
  const leg = document.getElementById("legend");
  leg.innerHTML = `<div class="layers" id="legKey" style="border-top:none;margin-top:0;padding-top:0"></div>`
    + `<div><span class="swring"></span>Tasted in class</div>`
    + `<div class="layers"><div class="ltitle">Show on map</div>`
    + [["terrain","Terrain shading and height colours"],["contours","Height lines (contours)"],["mountains","Mountain names"],["rivers","Rivers"],["lat","Latitude lines"]]
        .map(([k,l])=>`<label><input type="checkbox" data-layer="${k}"${LAYERS[k]?" checked":""}>${l}</label>`).join("")
    + `<div class="rule" style="margin-top:8px">Height above sea level</div><div class="hramp"></div><div class="hticks"><span>0</span><span>500</span><span>1,000</span><span>2,000</span><span>3,500+ m</span></div>`
    + `<div class="rule">Zoomed out, heights are averaged over about 9 km, so narrow hills show lower than they are. Zoom in on a wine area and the map switches to about 300 m detail, with height lines every 500 m, then every 100 m as you zoom closer. The gold dashed lines mark 30° and 50°, where most vineyards sit. Tutor's rule of thumb: every 100 m up is about 0.6°C cooler, so altitude can do what latitude does.</div><div class="rule" style="font-size:10.5px">Elevation: NOAA ETOPO 2022; Terrain Tiles on AWS Open Data (from SRTM and other public surveys); Natural Earth.</div></div>`;
  function drawKey(){
    const k = document.getElementById("legKey");
    k.innerHTML = state.heat
      ? `<div class="ltitle">Heat (climate)</div>` + HEAT.map(h=>`<div class="heatrow"><span class="sw" style="background:${h.c}"></span>${h.label}</div>`).join("")
        + `<div class="heatnote">From the climate call in your notes for each region, not latitude. Altitude, ocean breezes, fog and rain shadows move a region up or down: Casablanca and Adelaide Hills are cool for their latitude, Alsace is cool but dry and sunny. Sonoma (cool coast, warm inland) shows as moderate.</div>`
      : Object.values(STYLE).map(s=>`<div class="heatrow"><span class="sw" style="background:${s.c}"></span>${s.label}</div>`).join("");
  }
  drawKey();
  leg.querySelectorAll("[data-layer]").forEach(cb=> cb.onchange = ()=>{
    LAYERS[cb.dataset.layer] = cb.checked;
    try{ localStorage.setItem("wsetLayers", JSON.stringify(LAYERS)); }catch(e){}
    resize();
  });
  leg.addEventListener("click", e=> e.stopPropagation());
  document.getElementById("legendBtn").onclick = e => { leg.classList.toggle("open"); e.currentTarget.classList.toggle("on"); };

  // Map setup
  const wrap = document.getElementById("mapwrap");
  const svg = d3.select("#map");
  const g = svg.append("g");
  const gLand = g.append("g"), gRelief = g.append("g").attr("class","relief"), gDetail = g.append("g").attr("class","relief"), gBorder = g.append("g").attr("class","borders"),
        gCtr = g.append("g"), gCLbl = g.append("g"), gCtrD = g.append("g"), gCLblD = g.append("g"), gBelt = g.append("g"), gLat = g.append("g"), gRiver = g.append("g"), gRLbl = g.append("g"),
        gMtn = g.append("g"), gPins = g.append("g"), gLbl = g.append("g");
  const gAxis = svg.append("g").attr("class","axis");
  const MTNS = window.MOUNTAINS||[], LAND = window.LAND||{};
  let W = wrap.clientWidth, H = wrap.clientHeight;
  const projection = d3.geoNaturalEarth1();
  const path = d3.geoPath(projection);
  const fitBox = {type:"MultiPoint", coordinates:[[-165,72],[180,72],[-165,-50],[180,-50],[0,-50],[0,72]]};
  projection.fitExtent([[6,6],[W-6,H-6]], fitBox);

  const zoom = d3.zoom().scaleExtent([1,160])
    .translateExtent([[-W*0.25,-H*0.25],[W*1.25,H*1.25]])
    .on("zoom", ev => { g.attr("transform", ev.transform); state.k = ev.transform.k; state.t = ev.transform; resize(); });
  svg.call(zoom).on("dblclick.zoom", null);

  // Pins
  R.forEach(r => { r.xy = projection([r.lon, r.lat]); });
  const pins = gPins.selectAll("g.pin").data(R).join("g")
    .attr("class","pin").attr("transform", d=>`translate(${d.xy[0]},${d.xy[1]})`)
    .on("click", (ev,d) => { ev.stopPropagation(); select(d); });
  pins.append("circle").attr("class","hit").attr("fill","transparent");
  pins.filter(d=>d.tasted.length).append("circle").attr("class","ring");
  pins.append("circle").attr("class","dot");
  function pinFill(d){ return state.heat && d.heat ? d.heat.c : STYLE[d.style].c; }
  pins.select(".dot").attr("fill", pinFill);
  const labels = gLbl.selectAll("text").data(R).join("text").attr("class","lbl")
    .attr("x", d=>d.xy[0]).attr("y", d=>d.xy[1]).text(d=>d.name);

  function resize(){
    const k = state.k;
    const rs = Math.min(7, 4.5 + Math.log2(k)*0.5);
    pins.select(".dot").attr("r", rs/k).attr("stroke-width", 1.4/k);
    pins.select(".ring").attr("r", (rs+3.2)/k).attr("stroke-width", 2/k);
    pins.select(".hit").attr("r", 14/k);
    labels.style("font-size", (11/k)+"px").attr("stroke-width", 3/k).attr("dx", 9/k).attr("dy", 4/k)
      .style("display", d => (state.quiz || k < 3.2 || isDim(d)) ? "none" : null);
    // terrain layers
    gLat.selectAll("path").style("display", d => !LAYERS.lat ? "none" : (d%10===0 || (d%5===0 && k>=5) || k>=18) ? null : "none");
    gBelt.style("display", LAYERS.lat ? null : "none");
    gRelief.style("display", LAYERS.terrain ? null : "none");
    gDetail.style("display", LAYERS.terrain ? null : "none");
    updateDetail();
    gRiver.style("display", LAYERS.rivers ? null : "none");
    const cmin = {250:12, 500:6, 1000:3, 1500:6, 2000:3, 3000:3};
    const closeUp = k >= 12 && DETAIL.some(inView);
    gCtr.style("display", LAYERS.contours && !closeUp ? null : "none");
    gCtrD.style("display", LAYERS.contours && k >= 12 ? null : "none");
    gCtrD.selectAll("path").style("display", d => (d.properties.m % 500 === 0 || k >= 55) ? null : "none");
    gCLblD.style("display", LAYERS.contours && k >= 45 ? null : "none");
    gCLblD.selectAll("text").style("font-size", (9/k)+"px").attr("stroke-width", 2.5/k)
      .style("display", l => (l.m % 500 === 0 || k >= 90) ? null : "none");
    gCtr.selectAll("path").style("display", d => k >= cmin[d.properties.m] ? null : "none");
    gCLbl.style("display", LAYERS.contours && !closeUp && k >= 12 ? null : "none");
    gCLbl.selectAll("text").style("font-size", (9/k)+"px").attr("stroke-width", 2.5/k)
      .style("display", d => k >= Math.max(12, cmin[d.m]) ? null : "none");
    gRLbl.style("display", LAYERS.rivers ? null : "none");
    gRLbl.selectAll("text").style("font-size", (10/k)+"px").attr("stroke-width", 2.5/k).attr("dx", 4/k).attr("dy", -4/k)
      .style("display", k>=5 ? null : "none");
    gMtn.style("display", LAYERS.mountains ? null : "none");
    mtns.style("display", d => k>=d.k ? null : "none");
    mtns.select(".tri").attr("d", `M0,${-5/k}L${4.5/k},${3/k}L${-4.5/k},${3/k}Z`).attr("stroke-width", 0.8/k);
    mtns.select("text").style("font-size", (Math.min(12, 10 + Math.log2(k)*0.3)/k)+"px").attr("stroke-width", 3/k).attr("dx", 7/k).attr("dy", 4/k);
    mtns.select(".hit").attr("r", 12/k);
    drawAxis();
  }

  // Land
  fetch("world.json").then(r=>r.json()).then(topo=>{
    const countries = topojson.feature(topo, topo.objects.countries).features
      .filter(f=>f.properties.name !== "Antarctica");
    gLand.selectAll("path").data(countries).join("path")
      .attr("class", d=>"country" + (WINE_COUNTRIES.has(d.properties.name) ? " wine":""))
      .attr("d", path);
    gBorder.selectAll("path").data(countries).join("path").attr("d", path);
  });

  // Shaded relief (Natural Earth), pre-projected into the same projection
  let TILES = [];
  fetch("relief/tiles.json").then(r=>r.json()).then(t=>{
    TILES = t;
    gRelief.selectAll("image").data(TILES).join("image")
      .attr("href", d=>d.src).attr("preserveAspectRatio","none");
    placeRelief();
  }).catch(()=>{});
  function placeRelief(){
    const K = projection.scale(), [tx,ty] = projection.translate();
    gDetail.selectAll("image")
      .attr("x", d=>tx + d.x0*K).attr("y", d=>ty - d.y1*K)
      .attr("width", d=>d.w*K).attr("height", d=>d.h*K);
    gRelief.selectAll("image")
      .attr("x", d=>tx + d.x0*K).attr("y", d=>ty - d.y1*K)
      .attr("width", d=>d.w*K).attr("height", d=>d.h*K);
  }

  // Latitude lines: parallels are straight in this projection
  const LATS = d3.range(-60, 76, 1);
  function latY(lat){ return projection([0,lat])[1]; }
  function drawLat(){
    const xl = projection([-180,0])[0], xr = projection([180,0])[0];
    gLat.selectAll("path").data(LATS).join("path")
      .attr("class", d=> "lat" + (Math.abs(d)===30||Math.abs(d)===50 ? " edge" : d%10===0 ? " major" : ""))
      .attr("d", d=>{ const y = latY(d); return `M${xl},${y}H${xr}`; });
    gBelt.selectAll("rect").data([[30,50],[-50,-30]]).join("rect").attr("class","belt")
      .attr("x", xl).attr("width", xr-xl)
      .attr("y", d=>latY(d[1])).attr("height", d=>latY(d[0])-latY(d[1]));
  }
  function drawAxis(){
    if(!LAYERS.lat){ gAxis.selectAll("text").remove(); return; }
    const k = state.k, t = state.t;
    const step = k>=18 ? 1 : k>=5 ? 5 : 10;
    const vis = LATS.filter(l=>l%step===0).map(l=>({l, y:t.applyY(latY(l))})).filter(d=>d.y>58 && d.y<H-6);
    gAxis.selectAll("text").data(vis, d=>d.l).join("text")
      .attr("class", d=> Math.abs(d.l)===30||Math.abs(d.l)===50 ? "edge" : null)
      .attr("x", 6).attr("y", d=>d.y-3).attr("text-anchor","start")
      .text(d=> d.l===0 ? "Equator" : Math.abs(d.l)+"°"+(d.l>0?"N":"S"));
  }

  // Close-up relief and height lines for each wine area (Terrain Tiles, ~300 m), loaded only when zoomed in
  let DETAIL = [];
  fetch("relief/detail.json").then(r=>r.json()).then(t=>{
    DETAIL = t;
    gDetail.selectAll("image").data(DETAIL).join("image").attr("preserveAspectRatio","none");
    placeRelief(); resize();
  }).catch(()=>{});
  function tileRect(d){
    const K = projection.scale(), [tx,ty] = projection.translate();
    return [tx + d.x0*K, ty - d.y1*K, d.w*K, d.h*K];
  }
  function inView(d){
    const t = state.t, [x,y,w,h] = tileRect(d);
    const vx0 = t.invertX(0), vx1 = t.invertX(W), vy0 = t.invertY(0), vy1 = t.invertY(H);
    return x < vx1 && x+w > vx0 && y < vy1 && y+h > vy0;
  }
  function updateDetail(){
    const k = state.k;
    if(LAYERS.terrain && k >= 8){
      gDetail.selectAll("image").each(function(d){ if(!d.loaded && inView(d)){ d.loaded = true; this.setAttribute("href", d.src); } });
    }
    if(LAYERS.contours && k >= 12){
      DETAIL.forEach(d=>{
        if(d.cLoaded || !inView(d)) return;
        d.cLoaded = true;
        fetch(d.contours).then(r=>r.json()).then(fc=>{
          const gp = gCtrD.append("g");
          gp.selectAll("path").data(fc.features).join("path").attr("class", f=>"ctr m"+f.properties.m).attr("d", path);
          // one label per height per ~35 km square, so the map doesn't fill with numbers
          const seen = new Set(), lab = [];
          fc.features.filter(f=>f.geometry.coordinates.length>=20).forEach(f=>{
            const c = f.geometry.coordinates[Math.floor(f.geometry.coordinates.length/2)];
            const key = f.properties.m + ":" + Math.floor(c[0]/0.45) + ":" + Math.floor(c[1]/0.32);
            if(seen.has(key)) return; seen.add(key);
            lab.push({m:f.properties.m, lon:c[0], lat:c[1]});
          });
          gCLblD.append("g").selectAll("text").data(lab).join("text").attr("class","clbl").attr("text-anchor","middle")
            .text(l=>l.m.toLocaleString("en")+" m")
            .attr("x", l=>projection([l.lon,l.lat])[0]).attr("y", l=>projection([l.lon,l.lat])[1]);
          resize();
        }).catch(()=>{ d.cLoaded = false; });
      });
    }
  }

  // Height lines (contours) from ETOPO 2022
  fetch("contours.json").then(r=>r.json()).then(fc=>{
    gCtr.selectAll("path").data(fc.features).join("path").attr("class", d=>"ctr m"+d.properties.m).attr("d", path);
    const lab = fc.features.filter(f=>f.geometry.coordinates.length>=10).map(f=>{
      const c = f.geometry.coordinates[Math.floor(f.geometry.coordinates.length/2)];
      return {m:f.properties.m, lon:c[0], lat:c[1]};
    });
    gCLbl.selectAll("text").data(lab).join("text").attr("class","clbl").attr("text-anchor","middle").text(d=>d.m.toLocaleString("en")+" m");
    placeContourLabels(); resize();
  }).catch(()=>{});
  function placeContourLabels(){
    gCLbl.selectAll("text").attr("x", d=>projection([d.lon,d.lat])[0]).attr("y", d=>projection([d.lon,d.lat])[1]);
  }

  // Rivers
  fetch("rivers.json").then(r=>r.json()).then(fc=>{
    gRiver.selectAll("path").data(fc.features).join("path").attr("class","river").attr("d", path);
    const anchors = fc.features.map(f=>{
      const longest = f.geometry.coordinates.reduce((a,b)=> b.length>a.length ? b : a);
      const c = longest[Math.floor(longest.length/2)];
      return {name:f.properties.name, lon:c[0], lat:c[1]};
    });
    gRLbl.selectAll("text").data(anchors).join("text").attr("class","rlbl").text(d=>d.name);
    placeRiverLabels(); resize();
  }).catch(()=>{});
  function placeRiverLabels(){
    gRLbl.selectAll("text").attr("x", d=>projection([d.lon,d.lat])[0]).attr("y", d=>projection([d.lon,d.lat])[1])
      .attr("dx", 4/state.k).attr("dy", -4/state.k);
  }

  // Mountains
  MTNS.forEach(m=>{ m.xy = projection([m.lon, m.lat]); });
  const mtns = gMtn.selectAll("g.mtn").data(MTNS).join("g").attr("class","mtn")
    .attr("transform", d=>`translate(${d.xy[0]},${d.xy[1]})`)
    .on("click", (ev,d)=>{ ev.stopPropagation(); openMountain(d); });
  mtns.append("circle").attr("class","hit").attr("fill","transparent");
  mtns.append("path").attr("class","tri");
  mtns.append("text").text(d=>d.name);
  drawLat();

  // Zoom helpers
  function zoomToRegions(list, pad){
    if(!list.length) return;
    const xs = list.map(r=>r.xy[0]), ys = list.map(r=>r.xy[1]);
    let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
    const p = pad ?? 30;
    const bw = Math.max(x1-x0, 4), bh = Math.max(y1-y0, 4);
    const k = Math.min(160, 0.82/Math.max(bw/(W-p*2), bh/(H-p*2)));
    const cx = (x0+x1)/2, cy = (y0+y1)/2;
    svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate(W/2 - k*cx, H/2 - k*cy).scale(k));
  }
  function zoomWorld(){ svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity); }

  const JUMPS = [
    ["World", null],
    ["France", r=>r.country==="France"],
    ["Burgundy & Rhône", r=>["chablis","cote-de-nuits","cote-de-beaune","maconnais","beaujolais","northern-rhone","southern-rhone"].includes(r.id)],
    ["Bordeaux", r=>["bordeaux-left","bordeaux-right","pessac","sauternes"].includes(r.id)],
    ["Germany & Alsace", r=>r.country==="Germany"||r.id==="alsace"],
    ["Italy", r=>r.country==="Italy"],
    ["Spain & Portugal", r=>r.country==="Spain"||r.country==="Portugal"],
    ["Sparkling & fortified", r=>["champagne","prosecco","asti","cava","jerez","douro","tasmania","western-cape"].includes(r.id)],
    ["Tokaj", r=>r.id==="tokaj"],
    ["USA", r=>r.country==="USA"],
    ["Chile & Argentina", r=>r.country==="Chile"||r.country==="Argentina"],
    ["South Africa", r=>r.country==="South Africa"],
    ["Australia", r=>r.country==="Australia"],
    ["South Australia", r=>["barossa","eden","clare","mclaren","adelaide-hills"].includes(r.id)],
    ["New Zealand", r=>r.country==="New Zealand"],
  ];
  const jumps = document.getElementById("jumps");
  JUMPS.forEach(([label, fn])=>{
    const b = document.createElement("button"); b.className="chip"; b.textContent=label;
    b.onclick = ()=>{
      jumps.querySelectorAll(".chip").forEach(c=>c.classList.remove("on")); b.classList.add("on");
      if(!fn) return zoomWorld();
      const list = R.filter(fn);
      zoomToRegions(list, list.length===1 ? 160 : 30);
    };
    jumps.appendChild(b);
  });
  document.getElementById("zin").onclick = ()=> svg.transition().duration(300).call(zoom.scaleBy, 2);
  document.getElementById("zout").onclick = ()=> svg.transition().duration(300).call(zoom.scaleBy, 0.5);

  // Grape filter
  const allGrapes = [...new Set(R.flatMap(r=>r.grapes))].sort((a,b)=>a.localeCompare(b));
  const gRow = document.getElementById("grapes");
  const allBtn = document.createElement("button"); allBtn.className="chip on"; allBtn.textContent="All";
  allBtn.onclick = ()=> setGrape(null); gRow.appendChild(allBtn);
  const grapeBtns = {};
  allGrapes.forEach(gr=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=gr;
    b.onclick = ()=> setGrape(state.grape===gr ? null : gr);
    gRow.appendChild(b); grapeBtns[gr]=b;
  });
  function setGrape(gr, zoomIn){
    state.grape = gr;
    allBtn.classList.toggle("on", !gr);
    Object.entries(grapeBtns).forEach(([k,b])=>b.classList.toggle("on", k===gr));
    if(gr) grapeBtns[gr].scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
    apply();
    if(gr && zoomIn){
      closeCard();
      jumps.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
      const list = R.filter(r=>r.grapes.includes(gr));
      zoomToRegions(list, list.length===1 ? 160 : 40);
    }
  }

  function isDim(d){
    if(state.grape && !d.grapes.includes(state.grape)) return true;
    if(state.tasted && !d.tasted.length) return true;
    if(state.weak && !isWeak(d.id)) return true;
    return false;
  }
  function apply(){
    pins.classed("dim", isDim);
    resize();
    const n = R.filter(d=>!isDim(d)).length;
    const parts = [];
    if(state.grape) parts.push(state.grape);
    if(state.tasted) parts.push("tasted in class");
    if(state.weak) parts.push("weak spots");
    const cnt = document.getElementById("count");
    cnt.innerHTML = `<span>${n} region${n===1?"":"s"}` + (parts.length ? ` · ${esc(parts.join(" · "))}` : " · all") + (state.quiz ? " · names hidden" : "") + `</span>`
      + (state.grape && GRAPES[state.grape] ? `<button class="gp" id="gpBtn">${esc(state.grape)} profile ›</button>` : "")
      + `<span class="sp"></span><button class="qb" id="qView">Test this view</button><button class="qb${state.weak?" on":""}" id="qWeak" aria-pressed="${state.weak}">Weak spots</button>`;
    const gp = document.getElementById("gpBtn"); if(gp) gp.onclick = ()=> openGrape(state.grape);
    document.getElementById("qView").onclick = testView;
    document.getElementById("qWeak").onclick = ()=>{ state.weak = !state.weak; apply(); };
  }

  const tT = document.getElementById("tTasted"), tQ = document.getElementById("tQuiz");
  const tH = document.getElementById("tHeat");
  tH.onclick = ()=>{ state.heat=!state.heat; tH.classList.toggle("on",state.heat); tH.setAttribute("aria-pressed",state.heat);
    pins.select(".dot").attr("fill", pinFill); drawKey(); if(state.sel) render(state.sel); };
  tT.onclick = ()=>{ state.tasted=!state.tasted; tT.classList.toggle("on",state.tasted); tT.setAttribute("aria-pressed",state.tasted); apply(); };
  tQ.onclick = ()=>{ state.quiz=!state.quiz; tQ.classList.toggle("on",state.quiz); tQ.setAttribute("aria-pressed",state.quiz);
    state.revealed=false; if(state.sel) render(state.sel); apply(); };

  // Card
  const card = document.getElementById("card"), body = document.getElementById("cardBody");
  function select(d){
    state.sel = d; state.revealed = false;
    pins.classed("sel", p=>p===d);
    render(d); card.classList.add("open"); card.scrollTop = 0;
  }
  function closeCard(){ card.classList.remove("open"); pins.classed("sel", false); state.sel=null; }
  document.getElementById("cardClose").onclick = closeCard;
  svg.on("click", closeCard);

  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function wineHTML(w){
    const sat = w.a ? `<div class="sat"><b>Look</b><span>${esc(w.a)}</span><b>Nose</b><span>${esc(w.nose)}</span><b>Palate</b><span>${esc(w.p)}</span><b>Quality</b><span>${esc(w.q)}</span></div>` : "";
    return `<div class="wine"><div class="wn">${esc(w.n)}</div>${sat}${w.c ? `<div class="wc">${esc(w.c)}</div>`:""}</div>`;
  }
  const SRC = {class:"From your class notes", mix:"From class, plus general knowledge", gen:"General knowledge, not from class"};
  function latHTML(d){
    const a = Math.abs(d.lat), lo = 25, hi = 52, pct = v => ((Math.min(hi,Math.max(lo,v))-lo)/(hi-lo)*100).toFixed(1);
    const note = a >= 47 ? "Near the cool edge of the wine belt: high acidity and lighter body, unless sun, slopes or shelter help ripening."
      : a <= 37 ? "Near the hot edge of the wine belt: quality depends on what cools it, like altitude, ocean, fog or cold nights."
      : "Mid wine belt: the local cooling or warming factors decide the style.";
    return `<div class="sec"><h3>Latitude</h3><div class="latrow"><span class="latval">${a.toFixed(1)}°${d.lat>=0?"N":"S"}</span>
      <div class="latbar" aria-hidden="true"><div class="track"></div><div class="beltz" style="left:${pct(30)}%;width:${pct(50)-pct(30)}%"></div>
      <div class="tk" style="left:${pct(30)}%">30°</div><div class="tk" style="left:${pct(50)}%">50°</div>
      <div class="dotl" style="left:${pct(a)}%"></div></div></div><div class="latnote">${note}</div></div>`;
  }
  function openMountain(m){
    state.sel = null; pins.classed("sel", false);
    body.innerHTML = `
      <h2>${esc(m.name)}</h2>
      <div class="meta"><span>Mountains / hills</span><span>·</span><span>${Math.abs(m.lat).toFixed(1)}°${m.lat>=0?"N":"S"}</span></div>
      <div class="sec"><h3>Why it matters for wine</h3><p>${esc(m.why)}</p><div class="srcnote">${SRC[m.src]}</div></div>
      <button class="reveal" id="mZoom">Zoom in here</button>`;
    card.classList.add("open"); card.scrollTop = 0;
    document.getElementById("mZoom").onclick = ()=>{
      const k = Math.max(state.k, Math.min(40, m.k*2.2));
      svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate(W/2 - k*m.xy[0], H*0.32 - k*m.xy[1]).scale(k));
    };
  }
  function openGrape(name, from){
    const gp = GRAPES[name];
    const list = R.filter(r=>r.grapes.includes(name));
    body.innerHTML = `
      ${from ? `<button class="back" id="backBtn">‹ Back to ${esc(from.name)}</button>` : ""}
      <h2>${esc(name)}</h2>
      <div class="meta"><span>${gp ? esc(gp.type) + " grape" : "Grape"}</span><span>·</span><span>${list.length} region${list.length===1?"":"s"} on the map</span></div>
      ${gp ? `<div class="gprof"><b>Structure</b><span>${esc(gp.s)}</span><b>Flavours</b><span>${esc(gp.f)}</span><b>Climate</b><span>${esc(gp.cl)}</span><b>Remember</b><span>${esc(gp.k)}</span></div>` : ""}
      <div class="sec"><h3>Where it grows</h3><div class="rlist">${list.map(r=>`<button class="chip" data-r="${r.id}">${esc(state.quiz ? r.country : r.name)}</button>`).join("")}</div></div>
      <button class="reveal" id="showGrape">Show ${esc(name)} on the map</button>`;
    pins.classed("sel", false);
    card.classList.add("open"); card.scrollTop = 0;
    if(from) document.getElementById("backBtn").onclick = ()=> select(from);
    document.getElementById("showGrape").onclick = ()=> setGrape(name, true);
    body.querySelectorAll("[data-r]").forEach(b=> b.onclick = ()=>{
      const r = R.find(x=>x.id===b.dataset.r); select(r); zoomToRegions([r], 160);
    });
  }
  function render(d){
    const st = STYLE[d.style];
    if(state.quiz && !state.revealed){
      body.innerHTML = `
        <h2>Which region is this?</h2>
        <div class="meta"><span>${esc(d.country)}</span><span class="stylepill" style="background:${st.c}">${st.label}</span></div>
        <div class="quizq">Say the region, its main grapes and the climate out loud, then check.</div>
        <button class="reveal" id="revealBtn">Reveal</button>`;
      document.getElementById("revealBtn").onclick = ()=>{ state.revealed = true; render(d); };
      return;
    }
    const grapes = d.grapes.length
      ? d.grapes.map(gr=>`<button class="chip${state.grape===gr?" on":""}" data-g="${esc(gr)}">${esc(gr)}</button>`).join("")
      : (d.grapeNote ? "" : `<span style="font-size:14px">Not listed in your notes</span>`);
    body.innerHTML = `
      <h2>${esc(d.name)}</h2>
      <div class="meta"><span>${esc(d.country)}</span><span>·</span>${d.heat ? `<span class="heatpill" style="background:${d.heat.c}">🌡 ${esc(d.heat.label)}</span>` : ""}<span>${esc(d.climate)}</span>
        <span class="stylepill" style="background:${st.c}">${st.label}</span></div>
      <div class="sec"><h3>Grapes</h3><div class="gchips">${grapes}</div>${d.grapeNote ? `<div class="gnote">${esc(d.grapeNote)}</div>` : ""}</div>
      <div class="sec"><h3>On the label</h3><p>${esc(d.labels)}</p></div>
      <div class="sec"><h3>Remember</h3><p>${esc(d.notes)}</p></div>
      ${QUIZ[d.id] ? `<button class="reveal" id="testBtn">Test me · ${QUIZ[d.id].length} questions${TESTS[d.id] && TESTS[d.id].last!=null ? ` · last ${TESTS[d.id].last}/${QUIZ[d.id].length}` : ""}</button>` : ""}
      ${latHTML(d)}
      ${LAND[d.id] ? `<div class="sec"><h3>Lie of the land</h3><p>${esc(LAND[d.id].t)}</p><div class="srcnote">${SRC[LAND[d.id].src]}</div></div>` : ""}
      ${d.wines.length ? `<details class="acc tasted"><summary>✓ Tasted in class (${d.wines.length})</summary><div class="in">${d.wines.map(wineHTML).join("")}</div></details>` : ""}
      ${(TRAPS[d.id]||[]).length ? `<details class="acc"><summary>Exam traps & tutor tips</summary><div class="in"><ul>${TRAPS[d.id].map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></details>` : ""}
      ${FOOD[d.id] ? `<details class="acc food"><summary>Food pairing</summary><div class="in"><p><span class="tagg">Works:</span> ${esc(FOOD[d.id].g)}</p>${FOOD[d.id].x && FOOD[d.id].x!=="—" ? `<p><span class="tagg">Avoid:</span> ${esc(FOOD[d.id].x)}</p>`:""}</div></details>` : ""}
      ${d.grapes.length ? `<div class="sec" style="font-size:12px;color:var(--muted)">Tap a grape for its profile and everywhere it grows.</div>` : ""}`;
    body.querySelectorAll("[data-g]").forEach(b=> b.onclick = ()=> openGrape(b.dataset.g, d));
    const tb = document.getElementById("testBtn");
    if(tb) tb.onclick = ()=> startTest(shuffle(QUIZ[d.id].map((_,i)=>({rid:d.id, qi:i}))), d.name, d);
  }

  // ---- Region tests ----
  function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  let T = null;
  function startTest(items, title, region){
    T = {items, i:0, score:0, title, region, missed:[]};
    card.classList.add("open");
    showQ();
  }
  function regionName(id){ const r = R.find(x=>x.id===id); return r ? r.name : id; }
  function showQ(){
    const it = T.items[T.i], q = QUIZ[it.rid][it.qi];
    const opts = [q.a, ...q.w.map(x=>x[0])];
    const shown = q.fixed ? opts.slice().sort() : shuffle(opts);
    body.innerHTML = `
      <button class="back" id="tBack">‹ ${T.region ? "Back to " + esc(T.region.name) : "Stop test"}</button>
      <h2>${esc(T.title)}</h2>
      <div class="meta"><span>Question ${T.i+1} of ${T.items.length}</span><span>·</span><span>${esc(q.lo)}</span>${T.region ? "" : `<span>·</span><span>${esc(regionName(it.rid))}</span>`}</div>
      <div class="tq">${esc(q.q)}</div>
      ${shown.map((o,k)=>`<button class="topt" data-k="${k}">${esc(o)}</button>`).join("")}
      <div id="tRes"></div>`;
    card.scrollTop = 0;
    document.getElementById("tBack").onclick = endTestEarly;
    body.querySelectorAll(".topt").forEach(b=> b.onclick = ()=> answer(shown[+b.dataset.k], q, it, shown));
  }
  function answer(pick, q, it, shown){
    const ok = pick === q.a;
    body.querySelectorAll(".topt").forEach((b,k)=>{
      b.disabled = true;
      if(shown[k] === q.a) b.classList.add("right");
      else if(shown[k] === pick) b.classList.add("wrongpick");
    });
    const r = rec(it.rid);
    r.missed = (r.missed||[]).filter(x=>x!==it.qi);
    if(ok) T.score++; else { r.missed.push(it.qi); T.missed.push(it); }
    saveTests();
    const last = T.i === T.items.length-1;
    document.getElementById("tRes").innerHTML = `
      <div class="tres">
        <div class="verdict ${ok?"ok":"no"}">${ok ? "✓ Right" : "✗ Not quite. The answer is: " + esc(q.a)}</div>
        <div>${esc(q.why)}</div>
        <h4>Why the others are wrong</h4>
        <ul>${q.w.map(([o,y])=>`<li class="${o===pick?"mine":""}"><b>${esc(o)}</b>: ${esc(y)}</li>`).join("")}</ul>
        ${q.src ? `<div class="tline">Source: ${esc(q.src)}</div>` : ""}
      </div>
      <button class="reveal" id="tNext">${last ? "See my score" : "Next question"}</button>`;
    document.getElementById("tNext").onclick = ()=>{ if(last) finishTest(); else { T.i++; showQ(); } };
  }
  function finishTest(){
    const n = T.items.length, pct = Math.round(T.score/n*100);
    if(T.region){ rec(T.region.id).last = T.score; saveTests(); }
    const verdict = pct >= 85 ? "At distinction level." : pct >= 70 ? "Merit level. Have another go at the misses." : "Below merit. Read the notes for this one, then try again.";
    body.innerHTML = `
      <h2>${esc(T.title)}</h2>
      <div class="meta"><span>Score</span></div>
      <div style="font:650 34px Fraunces,Georgia,serif;margin-top:6px">${T.score}/${n} <span style="font-size:20px;color:var(--muted)">${pct}%</span></div>
      <div class="tbar"><i style="width:${pct}%"></i></div>
      <div class="tline">The distinction line is 85%. ${esc(verdict)}</div>
      ${T.missed.length ? `<div class="sec"><h3>To review</h3><ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.45">${T.missed.map(m=>`<li>${T.region ? "" : esc(regionName(m.rid)) + ": "}${esc(QUIZ[m.rid][m.qi].q.split("\n")[0])}</li>`).join("")}</ul></div>` : ""}
      <button class="reveal" id="tAgain">Try again</button>
      <button class="reveal ghost" id="tDone">${T.region ? "Back to " + esc(T.region.name) : "Close"}</button>
      <div class="tline" style="margin-top:10px">Regions where you miss a question show under Weak spots until you get it right.</div>`;
    card.scrollTop = 0;
    const again = T.items, title = T.title, region = T.region;
    document.getElementById("tAgain").onclick = ()=> startTest(shuffle(again), title, region);
    document.getElementById("tDone").onclick = ()=>{ const reg = T.region; T = null; if(reg) select(reg); else closeCard(); apply(); };
    apply();
  }
  function endTestEarly(){ const reg = T && T.region; T = null; apply(); if(reg) select(reg); else closeCard(); }
  function testView(){
    const t = state.t;
    const vis = R.filter(d=> QUIZ[d.id] && !isDim(d) && (()=>{ const x = t.applyX(d.xy[0]), y = t.applyY(d.xy[1]); return x>=0 && x<=W && y>=0 && y<=H; })());
    if(!vis.length){
      state.sel = null; pins.classed("sel", false);
      body.innerHTML = `<h2>No regions in view</h2><div class="quizq">Zoom or pan so at least one wine region is on screen, then try again.</div>`;
      card.classList.add("open"); return;
    }
    const pool = vis.flatMap(d=> QUIZ[d.id].map((_,i)=>({rid:d.id, qi:i})));
    state.sel = null; pins.classed("sel", false);
    startTest(shuffle(pool).slice(0,10), "Test this view", null);
  }

  // Exam guide (study-notes/07)
  const LOS = [
    ["LO1","Vineyard: grape parts, what the vine needs, ripening (sugar up, acid down), climate, latitude 30–50°, labelling terms (PDO/PGI etc.)",5],
    ["LO2","Winemaking: yeast → alcohol + CO₂, white/red/rosé order, oak (new adds flavour, old doesn't), malo = butter, lees = body + bread, bottle-ageing colour",4],
    ["LO3","Principal grapes: style, quality and their GIs",19],
    ["LO4","Regionally important grapes: style, quality and their GIs",12],
    ["LO5","Sparkling and fortified: how production shapes style",6],
    ["LO6","Storage, service, food and wine (textbook ch. 3, self-study)",4]];
  const TEMPS = [["Sweet wines","Well chilled","6–8°C"],["Sparkling","Well chilled","6–10°C"],["Light/medium whites, rosé","Chilled","7–10°C"],["Medium/full oaked whites","Lightly chilled","10–13°C"],["Light reds (Beaujolais, light Pinot)","Lightly chilled","~13°C"],["Medium/full reds","Room temperature","15–18°C"]];
  const SPK = [["Starts with","Dry base wine","Dry base wine","Grape juice"],["2nd ferment","In the bottle","Sealed tank","None (one, stopped early)"],["Lees","Long (autolysis)","Removed at once","None"],["Taste","Fruit + toast, brioche","Pure fruit","Pure fruit, sweet"],["Examples","Champagne, Cava, Cap Classique, Tasmania","Prosecco","Asti"]];
  function openExam(){
    state.sel = null; pins.classed("sel", false);
    const row = r => `<tr>${r.map((c,i)=>`<td${i===0?' style="color:var(--muted)"':''}>${esc(c)}</td>`).join("")}</tr>`;
    body.innerHTML = `
      <h2>Exam guide</h2>
      <div class="meta"><span>Tuesday 1 December</span><span>·</span><span>50 questions, 60 minutes</span></div>
      <div class="sec"><h3>Questions per learning outcome</h3>
        <table class="xt"><tbody>${LOS.map(l=>`<tr><td><b>${l[0]}</b><div style="color:var(--muted)">${esc(l[1])}</div><div class="lobar" style="width:${l[2]/19*100}%"></div></td><td class="n">${l[2]}</td></tr>`).join("")}</tbody></table>
        <div class="xnote">LO3 + LO4 = 31 of 50 (62%): grapes and regions are the exam. LO6 sounded like 5 in class; the spec says 4 — check p.19 of your copy.</div></div>
      <div class="sec"><h3>The maths</h3>
        <table class="xt"><thead><tr><th>Grade</th><th>Score</th><th style="text-align:right">Can miss</th></tr></thead><tbody>
        <tr><td>Pass 55%</td><td>28/50</td><td class="n">22</td></tr><tr><td>Merit 70%</td><td>35/50</td><td class="n">15</td></tr><tr><td><b>Distinction 85%</b></td><td><b>43/50</b></td><td class="n">7</td></tr></tbody></table>
        <div class="xnote">One mark each, no negative marking: never leave a blank. Go with your first instinct. Read every word ("old oak", "after fermentation is complete", "pulp").</div></div>
      <details class="acc"><summary>Serving temperatures (LO6)</summary><div class="in">
        <table class="xt"><tbody>${TEMPS.map(row).join("")}</tbody></table>
        <div class="xnote">The paper uses the textbook words. Pinot Grigio = chilled (7–10°C), not 10–13°C. Decant → Vintage Port. Flute for sparkling; reds in a larger glass. Store cool, constant, dark.</div></div></details>
      <details class="acc"><summary>Sparkling methods (LO5)</summary><div class="in">
        <table class="xt"><thead><tr><th></th><th>Traditional</th><th>Tank</th><th>Asti</th></tr></thead><tbody>${SPK.map(row).join("")}</tbody></table>
        <div class="xnote">Traditional order: base wine → sugar + yeast → 2nd ferment (+1–2% abv) → autolysis → riddling (gyropalette) → disgorgement → dosage → cork. NV Champagne 12 months on lees, Cava 9.</div></div></details>
      <details class="acc"><summary>Fortified: the one rule (LO5)</summary><div class="in">
        <table class="xt"><tbody>
          <tr><td style="color:var(--muted)">Spirit added DURING fermentation</td><td>Yeast killed, sugar left → <b>sweet</b> + high alcohol → Port</td></tr>
          <tr><td style="color:var(--muted)">Spirit added AFTER fermentation</td><td>Wine already dry → <b>dry</b> + higher alcohol → Sherry</td></tr></tbody></table>
        <div class="xnote">Sherry: Fino ~15% under flor (pale, bread, almond) · Oloroso ~17%, oxidative (walnut, caramel) · Amontillado = both · PX = sun-dried, sweet · Pale Cream = sweetened Fino, Cream = sweetened Oloroso.<br>Port: Ruby (basic) · Reserve Ruby · LBV and Vintage (the only single-year ports) · Tawny (oxidative) · 10/20/30/40 Year = average age · Vintage must be decanted.</div></div></details>
      <div class="xnote" style="margin-top:12px">From study-notes/07 (final session, 24 Nov). Serving temperatures are the standard Level 2 bands — check them against your textbook table.</div>`;
    card.classList.add("open"); card.scrollTop = 0;
  }
  document.getElementById("tExam").onclick = e => { e.stopPropagation(); openExam(); };

  // Resize handling
  window.addEventListener("resize", ()=>{
    const nw = wrap.clientWidth, nh = wrap.clientHeight;
    if(Math.abs(nw-W)<2 && Math.abs(nh-H)<2) return;
    W=nw; H=nh;
    projection.fitExtent([[6,6],[W-6,H-6]], fitBox);
    R.forEach(r => { r.xy = projection([r.lon, r.lat]); });
    pins.attr("transform", d=>`translate(${d.xy[0]},${d.xy[1]})`);
    labels.attr("x", d=>d.xy[0]).attr("y", d=>d.xy[1]);
    gLand.selectAll("path").attr("d", path);
    gBorder.selectAll("path").attr("d", path);
    gRiver.selectAll("path").attr("d", path);
    gCtr.selectAll("path").attr("d", path); placeContourLabels();
    gCtrD.selectAll("path").attr("d", path);
    gCLblD.selectAll("text").attr("x", l=>projection([l.lon,l.lat])[0]).attr("y", l=>projection([l.lon,l.lat])[1]);
    placeRelief(); drawLat(); placeRiverLabels();
    MTNS.forEach(m=>{ m.xy = projection([m.lon, m.lat]); });
    mtns.attr("transform", d=>`translate(${d.xy[0]},${d.xy[1]})`);
    zoom.translateExtent([[-W*0.25,-H*0.25],[W*1.25,H*1.25]]);
    svg.call(zoom.transform, d3.zoomIdentity);
  });

  setTimeout(()=>{ const h=document.getElementById("hint"); if(h) h.style.display="none"; }, 5000);
  apply();
})();
</script>
</body>
</html>
